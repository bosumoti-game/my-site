<script>
  /*
    GitHub Pages は、ないページのアドレス（/リポジトリ名/a/b/c など）のまま、このページを返す。
    CSS や画像を正しく読むため、サイトの入口（/リポジトリ名/）を <base> にする。
    このスクリプトは、URL を書いたほかの要素より前に置く。
  */
  (function () {
    var base = '/';
    if (/\.github\.io$/.test(location.hostname)) {
      var repo = location.pathname.split('/')[1];
      if (repo) base = '/' + repo + '/';
    }
    var el = document.createElement('base');
    el.href = base;
    document.head.appendChild(el);
  })();
</script>
