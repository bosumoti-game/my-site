<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>この端末の記録 ・ bosumoti-game</title>
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/records.css">
<link rel="icon" href="assets/bosumoti-logo.svg" type="image/svg+xml">
<script type="module" src="js/records.js"></script>
</head>
<body>

<header class="site-header container">
  <a class="site-logo" href="index.html">
    <img class="site-logo__mochi" src="assets/bosumoti-logo.svg" alt="" width="44" height="44">
    <span class="site-logo__name">bosumoti-game</span>
  </a>
  <div class="site-header__right">
    <nav class="site-nav" aria-label="メイン">
      <a href="index.html">ゲーム</a>
      <a href="records.html" aria-current="page">この端末の記録</a>
      <a href="news.html">お知らせ</a>
      <a href="about.html">自己紹介</a>
    </nav>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="テーマを切り替え">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"></path></svg>
    </button>
  </div>
</header>

<main class="records-main">
  <h1 class="heading records-title"><span class="mark" style="--m: var(--color-rank)">この端末の記録</span></h1>
  <div class="records-summary">
    <p class="records-summary__player" data-player>—</p>
    <p class="records-summary__played">遊んだゲーム <span class="num" data-played>— / —</span></p>
  </div>

  <table class="records-table">
    <caption>ゲームごとの自己ベスト</caption>
    <thead>
      <tr>
        <th scope="col">No.</th>
        <th scope="col">ゲーム</th>
        <th scope="col" class="is-num">自己ベスト</th>
        <th scope="col" class="is-num">今週の順位</th>
      </tr>
    </thead>
    <tbody data-records></tbody>
  </table>

  <section class="records-bottom">
    <form class="name-form" data-name-form novalidate>
      <label class="name-form__label" for="name-input">ランキングに出す名前</label>
      <div class="name-form__row">
        <input class="name-form__input" id="name-input" type="text" maxlength="10" autocomplete="off" placeholder="10文字まで" data-name-input>
        <button class="name-form__save" type="submit" data-name-save>保存</button>
      </div>
      <p class="name-form__message" data-name-message role="status" aria-live="polite"></p>
      <p class="name-form__hint" data-name-hint>後ろの番号は自動で付きます。同じ名前の人がいても大丈夫です。</p>
    </form>
    <div class="records-about">
      <p class="records-about__title">記録の保存について</p>
      記録はこの端末のブラウザに保存されています。ログインはいりませんが、別の端末やブラウザには引き継がれません。
    </div>
  </section>
</main>

<footer class="site-footer container">
  <p>© 2026 bosumoti-game</p>
</footer>

</body>
</html>
