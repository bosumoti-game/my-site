        /* ゲーム開始ハンドラ（多重実行防止・入力欄フォーカス解除） */
        let activeSitePlayer = null;
        function handleStartGame() {
            if (isCountingDown || isGameActive) return;

            // サイトモードでは名前入力欄を使わず、サイトのプレイヤー名で記録する
            const sitePlayer = getSitePlayer();
            const name = sitePlayer
                ? sitePlayer.name
                : playerNameInput.value.replace(NAME_STRIP_RE, '').trim().slice(0, 10);
            if (!name) {
                nameError.textContent = '名前を入力してください';
                return;
            }
            if (isOnlineRankingEnabled() && NAME_FORBIDDEN_LEAD_RE.test(name)) {
                nameError.textContent = '名前の先頭に = + - @ は使えません';
                return;
            }
            nameError.textContent = '';
            currentTournamentName = name;
            activeSitePlayer = sitePlayer;
            playerNameInput.blur(); // モバイルキーボードを確実に閉じる

            playClickSound();
            showScreen('countdown-screen');
            startCountdown();
        }

        startBtn.addEventListener('click', handleStartGame);

        /* オンライン時、入力中の名前に対応するタグ（この端末で過去に使った名前の場合）を案内 */
        const nameHint = document.getElementById('name-hint');
        const DEFAULT_NAME_HINT = nameHint ? nameHint.textContent : '';
        function updateNameHint() {
            if (!nameHint) return;

            // サイトモード：名前入力欄を隠し、サイトの「名前#タグ」で記録されることを案内
            const sitePlayer = getSitePlayer();
            document.body.classList.toggle('site-mode', !!sitePlayer);
            if (sitePlayer) {
                nameError.textContent = '';
                nameHint.textContent = `※ ${sitePlayer.name}${sitePlayer.tag ? '#' + sitePlayer.tag : ''} として記録されます`;
                return;
            }
            if (!isOnlineRankingEnabled()) {
                nameHint.textContent = DEFAULT_NAME_HINT;
                return;
            }
            const name = playerNameInput.value.replace(NAME_STRIP_RE, '').trim().slice(0, 10);
            const profile = getProfile(name);
            nameHint.textContent = (profile && profile.tag)
                ? `※ ${name}#${profile.tag} として記録されます（自己ベストを更新）`
                : '※ この端末で同じ名前を使うと自己ベストが更新されます';
        }
        playerNameInput.addEventListener('input', updateNameHint);

        playerNameInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            // IME変換確定のEnter（SafariはkeyCode 229）と長押しでは開始しない
            if (e.isComposing || e.keyCode === 229 || e.repeat) return;
            e.preventDefault();
            handleStartGame();
        });

        /* スタート画面でEnterキーによる開始を許可するフォーカス要素か判定 */
        function shouldTriggerStartOnEnter(activeEl) {
            if (!activeEl) return true;
            if (activeEl === playerNameInput) return false;
            if (activeEl.tagName === 'BUTTON' && activeEl !== startBtn && !activeEl.classList.contains('segmented-btn')) {
                return false;
            }
            return true;
        }

        /* スタート画面表示中のEnterキーによるゲーム開始（名前入力欄フォーカス外・モード切替後でも対応） */
        window.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' || e.isComposing || e.repeat) return;
            if (isCountingDown || isGameActive) return;

            const startScreen = document.getElementById('start-screen');
            if (!startScreen || !startScreen.classList.contains('active')) return;

            const activeEl = document.activeElement;
            if (!shouldTriggerStartOnEnter(activeEl)) return;

            e.preventDefault();
            if (activeEl && activeEl.classList.contains('segmented-btn')) {
                activeEl.blur();
            }
            handleStartGame();
        });

        /* リザルト画面表示中のEnter / Spaceキーによる次画面への進行 */
        let resultShownAt = 0;
        function handleResultScreenKeydown(e) {
            const isEnter = (e.key === 'Enter');
            const isSpace = (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar');
            if ((!isEnter && !isSpace) || e.isComposing || e.repeat || e.defaultPrevented) return;
            if (isCountingDown || isGameActive) return;

            const resultScreen = document.getElementById('result-screen');
            if (!resultScreen || !resultScreen.classList.contains('active')) return;

            // リザルト表示直後は、ゲーム中の連打で即スキップされないよう入力を無視
            if (performance.now() - resultShownAt < 600) {
                e.preventDefault();
                return;
            }

            const activeEl = document.activeElement;
            if (activeEl && activeEl.tagName === 'BUTTON' && activeEl !== restartBtn) return;

            e.preventDefault();
            if (activeEl === restartBtn) {
                restartBtn.blur();
            }
            restartBtn.click();
        }

        window.addEventListener('keydown', handleResultScreenKeydown);

        restartBtn.addEventListener('click', () => {
            cleanupAllTimers();
            isCountingDown = false;
            isGameActive = false;
            resultRequestSeq++;
            playClickSound();
            showScreen('start-screen');
            updateNameHint();
        });

        /* ==========================================================
           カウントダウン処理（多重起動完全防止）
        ========================================================== */
        let countIntervalTimer = null;
        function startCountdown() {
            isCountingDown = true;
            isGameActive = false;
            cleanupAllTimers();

            let count = 3;
            countdownText.textContent = count;
            playCountSound();

            countIntervalTimer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.textContent = count;
                    countdownText.style.animation = 'none';
                    void countdownText.offsetWidth;
                    countdownText.style.animation = 'pulseCount 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
                    playCountSound();
                } else {
                    clearInterval(countIntervalTimer);
                    countIntervalTimer = null;
                    isCountingDown = false;
                    isGameActive = true;

                    if (currentGameMode === 'click') {
                        startClickGame();
                    } else if (currentGameMode === 'move') {
                        startMoveGame();
                    } else if (currentGameMode === 'racer') {
                        startRacerGame();
                    } else if (currentGameMode === 'signal') {
                        startF1Game();
                    }
                }
            }, 1000);
        }

        /* ==========================================================
           1. CLICK ゲーム処理
        ========================================================== */
        function startClickGame() {
            showScreen('game-screen');
            score = 0;
            timeLeft = 30;

            document.getElementById('hud-time-label').textContent = 'TIME REMAINING';
            document.getElementById('hud-score-label').textContent = 'SCORE';
            document.getElementById('hud-unit').textContent = 's';
            timeBarBox.style.display = 'block';

            document.getElementById('score').textContent = score;
            document.getElementById('time-left').textContent = timeLeft;
            // 前回終了時の0%から伸びるアニメーションを見せないため、一時的にtransitionを無効化
            timeProgress.style.transition = 'none';
            timeProgress.style.width = '100%';
            void timeProgress.offsetWidth;
            timeProgress.style.transition = '';

            moveStage.style.display = 'none';
            racerStage.style.display = 'none';
            targetCircle.style.display = 'block';
            spawnCircle();

            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').textContent = timeLeft;
                const pct = (timeLeft / 30) * 100;
                timeProgress.style.width = `${pct}%`;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function spawnCircle() {
            const areaWidth = playArea.clientWidth || 300;
            const areaHeight = playArea.clientHeight || 400;
            const circleSize = 64;

            const minX = areaWidth * 0.15;
            const maxX = Math.max(minX, areaWidth * 0.85 - circleSize);
            const minY = areaHeight * 0.15;
            const maxY = Math.max(minY, areaHeight * 0.85 - circleSize);

            const randomX = Math.floor(minX + Math.random() * (maxX - minX));
            const randomY = Math.floor(minY + Math.random() * (maxY - minY));

            targetCircle.style.left = `${randomX}px`;
            targetCircle.style.top = `${randomY}px`;
        }

        function createHitParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'hit-particle';
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                const angle = (Math.PI * 2 * i) / 6;
                const dist = 20 + Math.random() * 15;
                particle.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                playArea.appendChild(particle);
                setTimeout(() => particle.remove(), 300);
            }
        }

        targetCircle.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            if (!isGameActive || currentGameMode !== 'click') return;
            playHitSound();
            score++;
            document.getElementById('score').textContent = score;

            const circleRect = targetCircle.getBoundingClientRect();
            const areaRect = playArea.getBoundingClientRect();
            createHitParticles(circleRect.left - areaRect.left + 32, circleRect.top - areaRect.top + 32);
            spawnCircle();
        });

        /* ==========================================================
           2. MOVE ゲーム処理
        ========================================================== */
        /* 物理キー位置（e.code）で判定：キー配列・IME状態に依存しない */
        const KEY_MAP = {
            KeyQ: 0, KeyW: 1, KeyE: 2, KeyR: 3,
            KeyU: 4, KeyI: 5, KeyO: 6, KeyP: 7
        };
        const GAME_KEY_CODES = new Set([...Object.keys(KEY_MAP), 'KeyF', 'KeyJ', 'Space']);

        let movePlayerLane = 3;
        let moveAnimFrame = null;
        let moveCrashTimer = null;
        let obstacles = [];
        let moveSpeed = 220;
        let lastFrameTime = 0;
        let isMoveGameOver = false;

        function setPlayerLane(lane) {
            if (lane < 0 || lane > 7 || !isGameActive || isMoveGameOver) return;
            movePlayerLane = lane;
            playMoveSound();
            updatePlayerPosition();

            keyGuides.forEach((cap, idx) => {
                if (idx === lane) {
                    cap.classList.add('pressed');
                    setTimeout(() => cap.classList.remove('pressed'), 120);
                }
            });
        }

        function updatePlayerPosition() {
            const areaWidth = playArea.clientWidth || 300;
            const laneWidth = areaWidth / 8;
            const playerX = laneWidth * movePlayerLane + (laneWidth - 36) / 2;
            movePlayer.style.left = `${playerX}px`;
        }

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
            if (!isGameActive) return;

            const gameScreen = document.getElementById('game-screen');
            if (!gameScreen || !gameScreen.classList.contains('active')) return;

            // 長押しの連続発火は無視（スクロール等の既定動作だけ抑止）
            if (e.repeat) {
                if (GAME_KEY_CODES.has(e.code)) e.preventDefault();
                return;
            }

            if (currentGameMode === 'move') {
                if (e.code in KEY_MAP) {
                    e.preventDefault();
                    setPlayerLane(KEY_MAP[e.code]);
                }
            } else if (currentGameMode === 'racer') {
                if (e.code === 'KeyF' || e.code === 'KeyJ') {
                    e.preventDefault();
                    triggerRacerCatch(e.code === 'KeyF' ? 'f' : 'j', e.timeStamp);
                }
            } else if (currentGameMode === 'signal') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    triggerF1Action(e.timeStamp);
                }
            }
        });

        keyGuides.forEach(cap => {
            cap.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (e.button !== 0) return;
                const lane = parseInt(cap.dataset.lane, 10);
                setPlayerLane(lane);
            });
        });

        function startMoveGame() {
            showScreen('game-screen');
            score = 0;
            isMoveGameOver = false;
            obstacles = [];
            moveSpeed = 230;

            document.getElementById('hud-time-label').textContent = 'SPEED LEVEL';
            document.getElementById('hud-score-label').textContent = 'CLEARED';
            document.getElementById('hud-unit').textContent = 'px/s';
            timeBarBox.style.display = 'none';

            document.getElementById('score').textContent = score;
            document.getElementById('time-left').textContent = Math.floor(moveSpeed);

            targetCircle.style.display = 'none';
            racerStage.style.display = 'none';
            moveStage.style.display = 'block';

            document.querySelectorAll('.obstacle-row').forEach(el => el.remove());

            setPlayerLane(3);
            updatePlayerPosition();
            spawnObstacleRow(-40);

            lastFrameTime = performance.now();
            if (moveAnimFrame) cancelAnimationFrame(moveAnimFrame);
            moveAnimFrame = requestAnimationFrame(moveGameLoop);
        }

        function spawnObstacleRow(yPos) {
            const holeLane = Math.floor(Math.random() * 8);
            const rowEl = document.createElement('div');
            rowEl.className = 'obstacle-row';
            rowEl.style.top = `${yPos}px`;

            for (let i = 0; i < 8; i++) {
                const block = document.createElement('div');
                block.className = (i === holeLane) ? 'obstacle-block hole' : 'obstacle-block';
                rowEl.appendChild(block);
            }

            playArea.appendChild(rowEl);
            obstacles.push({
                y: yPos,
                holeLane: holeLane,
                element: rowEl,
                passed: false
            });
        }

        function moveGameLoop(now) {
            if (isMoveGameOver || !isGameActive) return;
            // rAFのタイムスタンプは直前のperformance.now()より小さいことがあるため下限0で保護
            const dt = Math.max(0, Math.min((now - lastFrameTime) / 1000, 0.1));
            lastFrameTime = now;

            const areaHeight = playArea.clientHeight || 400;
            const judgeY = areaHeight - 84;
            const winTop = judgeY - 14;
            const winBottom = judgeY + 24;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                const prevY = obs.y;
                obs.y += moveSpeed * dt;
                obs.element.style.top = `${obs.y}px`;

                // 前フレームと今フレームの間で判定窓と重なったか（高速時のすり抜け防止）
                const crossedWindow = (obs.y >= winTop) && (prevY <= winBottom);
                if (!obs.passed && crossedWindow && movePlayerLane !== obs.holeLane) {
                    handleMoveCrash();
                    return;
                }

                if (!obs.passed && obs.y > judgeY + 24) {
                    obs.passed = true;
                    score++;
                    playPassSound();
                    document.getElementById('score').textContent = score;
                    moveSpeed += 8;
                    document.getElementById('time-left').textContent = Math.floor(moveSpeed);
                }

                if (obs.y > areaHeight + 50) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                }
            }

            const spawnInterval = 195;
            const topMostY = (obstacles.length > 0) ? obstacles[obstacles.length - 1].y : 0;
            if (topMostY > -30) {
                spawnObstacleRow(topMostY - spawnInterval);
            }

            moveAnimFrame = requestAnimationFrame(moveGameLoop);
        }

        function handleMoveCrash() {
            isMoveGameOver = true;
            if (moveAnimFrame) cancelAnimationFrame(moveAnimFrame);
            playCrashSound();

            playArea.classList.add('shake');
            setTimeout(() => playArea.classList.remove('shake'), 300);

            if (moveCrashTimer) clearTimeout(moveCrashTimer);
            moveCrashTimer = setTimeout(() => {
                moveCrashTimer = null;
                if (!isGameActive) return;
                document.querySelectorAll('.obstacle-row').forEach(el => el.remove());
                endGame();
            }, 500);
        }

        /* ==========================================================
           3. RACER ゲーム処理（空気抵抗・重力演算完全保持）
        ========================================================== */
        const RACER_GRAVITY = 2750;
        const RACER_AIR_DRAG = 0.00038;

        let racerCurrentRound = 0;
        const RACER_TOTAL_ROUNDS = 5;
        let racerState = 'idle';
        let racerDropStartTime = 0;
        let racerDropTimer = null;
        let racerPhysicsAnim = null;
        let racerLastTime = 0;
        let racerRoundResolvedTimer = null;
        let racerPenaltyActive = false;
        // 当該ラウンドで加算した内容（決着後のペナルティで巻き戻すために記録）
        let racerAddedScoreThisRound = 0;
        let racerAddedSuccessThisRound = 0;
        let racerAddedTimesThisRound = 0;

        const racerBalls = {
            left: { active: false, y: 60, velocity: 0, caught: false, catchTime: null, slow: false, element: racerBallLeft },
            right: { active: false, y: 60, velocity: 0, caught: false, catchTime: null, slow: false, element: racerBallRight }
        };

        let racerReactionTimes = [];
        // ラウンドごとの記録（オンラインランキングでサーバーがスコアを再計算するために送信）
        let racerRoundLog = [];
        let racerSuccessCount = 0;
        let racerTotalDropsCount = 0;

        function resetRacerBalls() {
            const areaWidth = playArea.clientWidth || 300;
            const leftX = areaWidth * 0.28 - 29;
            const rightX = areaWidth * 0.72 - 29;

            racerBallLeft.style.left = `${leftX}px`;
            racerBallRight.style.left = `${rightX}px`;

            ['left', 'right'].forEach(side => {
                const b = racerBalls[side];
                b.active = false;
                b.y = 60;
                b.velocity = 0;
                b.caught = false;
                b.catchTime = null;
                b.slow = false;
                b.element.style.top = `${b.y}px`;
                b.element.classList.remove('caught', 'faulted');
                b.element.style.opacity = '1';
            });

            racerPenaltyActive = false;
            racerAddedScoreThisRound = 0;
            racerAddedSuccessThisRound = 0;
            racerAddedTimesThisRound = 0;
        }

        function showRacerFeedback(mainText, subText = '', type = '') {
            racerFeedback.textContent = '';
            const mainDiv = document.createElement('div');
            mainDiv.className = 'feedback-main';
            mainDiv.textContent = mainText;
            racerFeedback.appendChild(mainDiv);

            if (subText) {
                const subDiv = document.createElement('div');
                subDiv.className = 'feedback-sub';
                subDiv.textContent = subText;
                racerFeedback.appendChild(subDiv);
            }
            racerFeedback.className = type ? `active ${type}` : 'active';
        }

        function hideRacerFeedback() {
            racerFeedback.className = '';
        }

        function startRacerGame() {
            showScreen('game-screen');
            score = 0;
            racerCurrentRound = 0;
            racerSuccessCount = 0;
            racerTotalDropsCount = 0;
            racerReactionTimes = [];
            racerRoundLog = [];

            document.getElementById('hud-time-label').textContent = 'TRIAL';
            document.getElementById('hud-score-label').textContent = 'SCORE';
            document.getElementById('hud-unit').textContent = '';
            timeBarBox.style.display = 'none';

            document.getElementById('score').textContent = score;
            document.getElementById('time-left').textContent = `1 / ${RACER_TOTAL_ROUNDS}`;

            targetCircle.style.display = 'none';
            moveStage.style.display = 'none';
            racerStage.style.display = 'block';

            prepareNextRacerRound();
        }

        function prepareNextRacerRound() {
            if (racerCurrentRound >= RACER_TOTAL_ROUNDS || !isGameActive) {
                endGame();
                return;
            }

            racerCurrentRound++;
            document.getElementById('time-left').textContent = `${racerCurrentRound} / ${RACER_TOTAL_ROUNDS}`;
            resetRacerBalls();
            showRacerFeedback('READY...', '', '');

            racerState = 'waiting';

            const randomDelay = 1400 + Math.random() * 1800;
            if (racerDropTimer) clearTimeout(racerDropTimer);
            racerDropTimer = setTimeout(triggerBallDrop, randomDelay);
        }

        /* タブ非表示でラウンドが不正になるのを防ぐため、進行中ラウンドを取り消す */
        function suspendRacerRound() {
            if (racerState !== 'waiting' && racerState !== 'falling') return;
            if (racerState === 'falling') {
                racerTotalDropsCount -= (racerBalls.left.active ? 1 : 0) + (racerBalls.right.active ? 1 : 0);
            }
            if (racerPhysicsAnim) { cancelAnimationFrame(racerPhysicsAnim); racerPhysicsAnim = null; }
            if (racerDropTimer) { clearTimeout(racerDropTimer); racerDropTimer = null; }
            racerCurrentRound--;
            racerState = 'suspended';
        }

        function triggerBallDrop() {
            if (racerState !== 'waiting' || !isGameActive) return;
            if (document.hidden) {
                suspendRacerRound();
                return;
            }

            racerState = 'falling';
            hideRacerFeedback();

            const patternRand = Math.random();
            if (patternRand < 0.35) {
                racerBalls.left.active = true;
                racerBalls.right.active = false;
                racerTotalDropsCount += 1;
            } else if (patternRand < 0.70) {
                racerBalls.left.active = false;
                racerBalls.right.active = true;
                racerTotalDropsCount += 1;
            } else {
                racerBalls.left.active = true;
                racerBalls.right.active = true;
                racerTotalDropsCount += 2;
            }

            // 計測起点は、ボールが実際に動き始める最初のrAFフレームで確定する
            racerDropStartTime = 0;
            racerLastTime = performance.now();

            playDropSound();

            if (racerPhysicsAnim) cancelAnimationFrame(racerPhysicsAnim);
            racerPhysicsAnim = requestAnimationFrame(racerPhysicsLoop);
        }

        function racerPhysicsLoop(now) {
            if (racerState !== 'falling' || !isGameActive) return;

            if (!racerDropStartTime) {
                racerDropStartTime = now;
                racerLastTime = now;
            }
            const dt = Math.max(0, Math.min((now - racerLastTime) / 1000, 0.05));
            racerLastTime = now;
            const areaHeight = playArea.clientHeight || 400;

            ['left', 'right'].forEach(side => {
                const b = racerBalls[side];
                if (!b.active || b.caught || b.slow) return;

                const airDrag = RACER_AIR_DRAG * b.velocity * Math.abs(b.velocity);
                const acceleration = RACER_GRAVITY - airDrag;

                b.velocity += acceleration * dt;
                b.y += b.velocity * dt;
                b.element.style.top = `${b.y}px`;

                if (b.y > areaHeight - 20) {
                    b.slow = true;
                    b.element.style.opacity = '0';
                }
            });

            const activeBalls = Object.values(racerBalls).filter(b => b.active);
            const allResolved = activeBalls.every(b => b.caught || b.slow);

            if (allResolved) {
                handleRacerRoundResolved();
                return;
            }

            racerPhysicsAnim = requestAnimationFrame(racerPhysicsLoop);
        }

        function handleRacerRoundResolved() {
            if (racerPenaltyActive || !isGameActive) return;
            racerState = 'resolved';
            if (racerPhysicsAnim) cancelAnimationFrame(racerPhysicsAnim);

            const isDoubleDrop = (racerBalls.left.active && racerBalls.right.active);
            const leftSuccess = (racerBalls.left.active && racerBalls.left.caught);
            const rightSuccess = (racerBalls.right.active && racerBalls.right.caught);

            if (isDoubleDrop) {
                if (leftSuccess && rightSuccess) {
                    playDoubleCatchSound();
                    const tL = racerBalls.left.catchTime;
                    const tR = racerBalls.right.catchTime;
                    racerReactionTimes.push(tL, tR);
                    racerSuccessCount += 2;

                    const scoreL = calcReactionScore(tL);
                    const scoreR = calcReactionScore(tR);
                    const added = calcDoubleDropAverageScore(scoreL, scoreR);
                    score += added;
                    racerAddedScoreThisRound = added;
                    racerAddedSuccessThisRound = 2;
                    racerAddedTimesThisRound = 2;
                    document.getElementById('score').textContent = score;

                    showRacerFeedback('DOUBLE CATCH!', `L: ${tL}ms | R: ${tR}ms`, 'double-catch');
                } else if (leftSuccess || rightSuccess) {
                    playSlowSound();
                    const successBall = leftSuccess ? racerBalls.left : racerBalls.right;
                    const t = successBall.catchTime;
                    racerReactionTimes.push(t);
                    racerSuccessCount += 1;

                    const singleScore = calcReactionScore(t);
                    const added = calcDoubleDropAverageScore(singleScore, 0);
                    score += added;
                    racerAddedScoreThisRound = added;
                    racerAddedSuccessThisRound = 1;
                    racerAddedTimesThisRound = 1;
                    document.getElementById('score').textContent = score;

                    showRacerFeedback('1 CATCH / 1 SLOW', `TIME: ${t}ms`, 'split');
                } else {
                    playSlowSound();
                    playArea.classList.add('shake');
                    setTimeout(() => playArea.classList.remove('shake'), 300);
                    showRacerFeedback('SLOW!', '', 'slow');
                }
            } else {
                const targetBall = racerBalls.left.active ? racerBalls.left : racerBalls.right;
                if (targetBall.caught) {
                    const t = targetBall.catchTime;
                    racerReactionTimes.push(t);
                    racerSuccessCount += 1;

                    const singleScore = calcReactionScore(t);
                    score += singleScore;
                    racerAddedScoreThisRound = singleScore;
                    racerAddedSuccessThisRound = 1;
                    racerAddedTimesThisRound = 1;
                    document.getElementById('score').textContent = score;

                    showRacerFeedback('CATCH!', `${t} ms`, 'catch');
                } else {
                    playSlowSound();
                    playArea.classList.add('shake');
                    setTimeout(() => playArea.classList.remove('shake'), 300);
                    showRacerFeedback('SLOW!', '', 'slow');
                }
            }

            racerRoundLog.push({
                drops: isDoubleDrop ? 2 : 1,
                times: [racerBalls.left, racerBalls.right].filter(b => b.active && b.caught).map(b => b.catchTime),
                penalty: false
            });

            if (racerRoundResolvedTimer) clearTimeout(racerRoundResolvedTimer);
            racerRoundResolvedTimer = setTimeout(() => {
                hideRacerFeedback();
                prepareNextRacerRound();
            }, 1200);
        }

        function triggerRacerPenalty(reasonText, subReason = '') {
            // 決着後のペナルティは記録済みのラウンドを0点に、決着前は新しいラウンドとして記録
            if (racerState === 'resolved' && racerRoundLog.length > 0) {
                const lastRound = racerRoundLog[racerRoundLog.length - 1];
                lastRound.penalty = true;
                lastRound.times = [];
            } else {
                racerRoundLog.push({
                    drops: (racerBalls.left.active ? 1 : 0) + (racerBalls.right.active ? 1 : 0),
                    times: [],
                    penalty: true
                });
            }

            racerPenaltyActive = true;
            racerState = 'resolved';

            if (racerPhysicsAnim) cancelAnimationFrame(racerPhysicsAnim);
            if (racerDropTimer) clearTimeout(racerDropTimer);
            if (racerRoundResolvedTimer) clearTimeout(racerRoundResolvedTimer);

            // 決着後に出たペナルティ：当該ラウンドの得点・成功数・反応時間を取り消す
            if (racerAddedScoreThisRound > 0 || racerAddedSuccessThisRound > 0) {
                score -= racerAddedScoreThisRound;
                racerSuccessCount -= racerAddedSuccessThisRound;
                if (racerAddedTimesThisRound > 0) {
                    racerReactionTimes.splice(-racerAddedTimesThisRound, racerAddedTimesThisRound);
                }
                document.getElementById('score').textContent = score;
                racerAddedScoreThisRound = 0;
                racerAddedSuccessThisRound = 0;
                racerAddedTimesThisRound = 0;
            }

            ['left', 'right'].forEach(side => {
                const b = racerBalls[side];
                if (b.caught) {
                    b.caught = false;
                    b.element.classList.remove('caught');
                    b.element.classList.add('faulted');
                }
            });

            playPenaltySound();
            playArea.classList.add('shake');
            setTimeout(() => playArea.classList.remove('shake'), 300);

            showRacerFeedback(reasonText, subReason, 'fault');

            racerRoundResolvedTimer = setTimeout(() => {
                hideRacerFeedback();
                prepareNextRacerRound();
            }, 1300);
        }

        function calcReactionScore(reactionTime) {
            if (reactionTime <= 200) return 10;
            if (reactionTime <= 240) return 9;
            if (reactionTime <= 280) return 8;
            if (reactionTime <= 330) return 7;
            if (reactionTime <= 380) return 6;
            if (reactionTime <= 430) return 5;
            if (reactionTime <= 480) return 4;
            return 3;
        }

        function calcDoubleDropAverageScore(scoreL, scoreR) {
            return Math.round((scoreL + scoreR) / 2);
        }

        function triggerRacerCatch(key, eventTime = performance.now()) {
            if (racerPenaltyActive || !isGameActive) return;

            const btn = (key === 'f') ? racerBtnLeft : racerBtnRight;
            btn.classList.add('pressed');
            setTimeout(() => btn.classList.remove('pressed'), 120);

            if (racerState === 'waiting') {
                triggerRacerPenalty('FAULT!', '早すぎ');
                return;
            }

            if (racerState === 'falling' || racerState === 'resolved') {
                const isDoubleDrop = (racerBalls.left.active && racerBalls.right.active);
                const targetSide = (key === 'f') ? 'left' : 'right';
                const targetBall = racerBalls[targetSide];

                if (!isDoubleDrop && !targetBall.active) {
                    triggerRacerPenalty('PENALTY!', '両押し / お手つき');
                    return;
                }

                if (racerState === 'falling') {
                    // ボールがまだ動き始めていない（最初のフレーム前）入力は計測対象外
                    if (targetBall.active && !targetBall.caught && !targetBall.slow && racerDropStartTime) {
                        targetBall.caught = true;
                        targetBall.catchTime = Math.max(0, Math.round(eventTime - racerDropStartTime));
                        targetBall.element.classList.add('caught');
                        playCatchSound();

                        const otherSide = (targetSide === 'left') ? 'right' : 'left';
                        const otherBall = racerBalls[otherSide];
                        if (isDoubleDrop && otherBall.active && !otherBall.caught && !otherBall.slow) {
                            showRacerFeedback(`${targetSide.toUpperCase()} CATCH!`, 'NEXT!', 'catch');
                        }
                    }
                }
            }
        }

        [[racerBtnLeft, 'f'], [racerBtnRight, 'j'], [racerBallLeft, 'f'], [racerBallRight, 'j']].forEach(([el, key]) => {
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (e.button !== 0) return;
                triggerRacerCatch(key, e.timeStamp);
            });
        });

        /* ==========================================================
           4. F1 START ゲーム処理（三眼縦型シグナル & ブラックアウト反応）
        ========================================================== */
        let f1State = 'idle'; // idle, breath, step1, step2, step3, lights_out, finished
        let f1StartTime = 0;
        let f1ReactionTime = 0;
        let f1IsFault = false;
        let f1IsTimeout = false;

        function resetF1Lamps() {
            [f1Lamp1, f1Lamp2, f1Lamp3].forEach(lamp => {
                if (lamp) lamp.classList.remove('lit');
            });
        }

        function showF1Feedback(mainText, subText = '', type = '') {
            if (!f1FeedbackMain || !f1FeedbackSub) return;
            f1FeedbackMain.textContent = mainText;
            f1FeedbackSub.textContent = subText;
            f1Feedback.className = type ? `active ${type}` : 'active';
        }

        function hideF1Feedback() {
            if (f1Feedback) f1Feedback.className = '';
        }

        function startF1Game() {
            showScreen('game-screen');
            score = 0;
            f1State = 'breath';
            f1ReactionTime = 0;
            f1IsFault = false;
            f1IsTimeout = false;
            cleanupF1Timers();
            resetF1Lamps();

            document.getElementById('hud-time-label').textContent = 'SIGNAL STATUS';
            document.getElementById('hud-score-label').textContent = 'REACTION';
            document.getElementById('hud-unit').textContent = '';
            timeBarBox.style.display = 'none';

            document.getElementById('score').textContent = '--';
            document.getElementById('time-left').textContent = 'WAIT';

            targetCircle.style.display = 'none';
            moveStage.style.display = 'none';
            racerStage.style.display = 'none';
            if (f1Stage) f1Stage.style.display = 'block';

            showF1Feedback('STANDBY', '一呼吸置いてシグナル点灯...', '');

            // 1. 一呼吸（約1.0秒）置いた後に点灯シークエンス開始
            const t1 = setTimeout(() => {
                if (!isGameActive || f1State !== 'breath') return;
                runF1SignalSequence();
            }, 1000);
            f1Timers.push(t1);
        }

        function runF1SignalSequence() {
            // 第1眼点灯
            f1State = 'step1';
            if (f1Lamp1) f1Lamp1.classList.add('lit');
            playSignalBeep(650);
            document.getElementById('time-left').textContent = 'RED 1/3';
            showF1Feedback('STAY READY', '消灯まで待機...', '');

            const t2 = setTimeout(() => {
                if (!isGameActive || f1State !== 'step1') return;
                // 第2眼点灯
                f1State = 'step2';
                if (f1Lamp2) f1Lamp2.classList.add('lit');
                playSignalBeep(650);
                document.getElementById('time-left').textContent = 'RED 2/3';

                const t3 = setTimeout(() => {
                    if (!isGameActive || f1State !== 'step2') return;
                    // 第3眼点灯（三眼すべて点灯）
                    f1State = 'step3';
                    if (f1Lamp3) f1Lamp3.classList.add('lit');
                    playSignalBeep(650);
                    document.getElementById('time-left').textContent = 'ALL RED';
                    showF1Feedback('ALL RED', '消灯の瞬間を狙え！', '');

                    // 三眼すべて点灯後、短いランダム秒（1.0秒〜2.5秒）の後に消灯
                    const randomDelay = 1000 + Math.random() * 1500;
                    const t4 = setTimeout(() => {
                        if (!isGameActive || f1State !== 'step3') return;
                        triggerF1LightsOut();
                    }, randomDelay);
                    f1Timers.push(t4);
                }, 1000);
                f1Timers.push(t3);
            }, 1000);
            f1Timers.push(t2);
        }

        function triggerF1LightsOut() {
            f1State = 'lights_out';
            resetF1Lamps();
            f1StartTime = performance.now();
            // 消灯が実際に描画される次フレームを計測起点にする
            requestAnimationFrame((ts) => {
                if (f1State === 'lights_out') f1StartTime = ts;
            });
            document.getElementById('time-left').textContent = 'GO!';
            showF1Feedback('LIGHTS OUT!', 'NOW! SPACE!', 'go');
            playTone(900, 'sine', 0.08, 0.2);

            // タイムアウト監視（3.5秒放置で自動終了）
            const tTimeout = setTimeout(() => {
                if (isGameActive && f1State === 'lights_out') {
                    handleF1Timeout();
                }
            }, 3500);
            f1Timers.push(tTimeout);
        }

        function triggerF1Action(eventTime = performance.now()) {
            if (!isGameActive || currentGameMode !== 'signal') return;

            if (f1ActionBtn) {
                f1ActionBtn.classList.add('pressed');
                setTimeout(() => f1ActionBtn.classList.remove('pressed'), 120);
            }

            // 消灯前に押した場合はフライング（ジャンプスタート失格）
            if (f1State === 'breath' || f1State === 'step1' || f1State === 'step2' || f1State === 'step3') {
                handleF1JumpStart();
                return;
            }

            // 消灯後の正規リアクション
            if (f1State === 'lights_out') {
                f1State = 'finished';
                cleanupF1Timers();
                f1ReactionTime = Math.max(0, Math.round(eventTime - f1StartTime));
                f1IsFault = false;

                // スコア計算: 反応が早いほど高得点（最大1000点）
                score = Math.max(0, 1000 - f1ReactionTime);
                document.getElementById('score').textContent = score;
                document.getElementById('time-left').textContent = `${f1ReactionTime} ms`;

                playCatchSound();
                showF1Feedback(`${f1ReactionTime} ms`, 'START RECORDED!', 'success');

                const tEnd = setTimeout(() => {
                    endGame();
                }, 1200);
                f1Timers.push(tEnd);
            }
        }

        function handleF1JumpStart() {
            f1State = 'finished';
            f1IsFault = true;
            f1ReactionTime = null;
            score = 0;
            cleanupF1Timers();

            document.getElementById('score').textContent = '0';
            document.getElementById('time-left').textContent = 'FAULT';

            playPenaltySound();
            playArea.classList.add('shake');
            setTimeout(() => playArea.classList.remove('shake'), 300);

            showF1Feedback('FALSE START!', '消灯前のフライング失格', 'fault');

            const tEnd = setTimeout(() => {
                endGame();
            }, 1400);
            f1Timers.push(tEnd);
        }

        function handleF1Timeout() {
            f1State = 'finished';
            f1IsFault = false;
            f1IsTimeout = true;
            f1ReactionTime = null;
            score = 0;
            cleanupF1Timers();

            document.getElementById('score').textContent = '0';
            document.getElementById('time-left').textContent = 'SLOW';

            playSlowSound();
            showF1Feedback('TIMEOUT', 'タイムオーバー', 'slow');

            const tEnd = setTimeout(() => {
                endGame();
            }, 1200);
            f1Timers.push(tEnd);
        }

        if (f1ActionBtn) {
            f1ActionBtn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (e.button !== 0) return;
                triggerF1Action(e.timeStamp);
            });
        }
        if (f1Stage) {
            f1Stage.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return;
                if (e.target.closest('#f1-action-btn')) return;
                triggerF1Action(e.timeStamp);
            });
        }

        /* ==========================================================
           タブ非表示時の保護（不正な反応時間・タイムアウトの防止）
        ========================================================== */
        document.addEventListener('visibilitychange', () => {
            if (!isGameActive) return;
            if (document.hidden) {
                if (currentGameMode === 'racer') {
                    suspendRacerRound();
                } else if (currentGameMode === 'signal' &&
                           f1State !== 'finished' && f1State !== 'suspended') {
                    // 試行を無効化して、復帰時にやり直す
                    cleanupF1Timers();
                    resetF1Lamps();
                    f1State = 'suspended';
                }
            } else {
                if (currentGameMode === 'move') {
                    lastFrameTime = performance.now();
                } else if (currentGameMode === 'racer' && racerState === 'suspended') {
                    prepareNextRacerRound();
                } else if (currentGameMode === 'signal' && f1State === 'suspended') {
                    startF1Game();
                }
            }
        });

        /* ==========================================================
           リザルト処理
        ========================================================== */
        function endGame() {
            isGameActive = false;
            cleanupAllTimers();

            targetCircle.style.display = 'none';
            moveStage.style.display = 'none';
            racerStage.style.display = 'none';
            if (f1Stage) f1Stage.style.display = 'none';
            playEndSound();

            let rankings = getRankings();
            const existingIndex = rankings.findIndex(r => r.name.toLowerCase() === currentTournamentName.toLowerCase());

            if (existingIndex !== -1) {
                if (score > rankings[existingIndex].score) {
                    rankings[existingIndex].score = score;
                }
            } else {
                rankings.push({ name: currentTournamentName, score: score });
            }

            rankings.sort((a, b) => b.score - a.score);
            saveRankings(rankings);

            const myRank = rankings.findIndex(r => r.name.toLowerCase() === currentTournamentName.toLowerCase()) + 1;

            animateScoreCount(score);

            const unitMap = { click: 'pts', move: '列', racer: 'pts', signal: 'pts' };
            document.getElementById('final-unit').textContent = unitMap[currentGameMode] || 'pts';
            document.getElementById('result-rank').textContent = `順位: ${myRank} 位 / ${rankings.length} 人中`;

            if (currentGameMode === 'racer') {
                racerStatsRow.style.display = 'flex';
                if (f1StatsRow) f1StatsRow.style.display = 'none';
                document.getElementById('racer-stat-catches').textContent = `${racerSuccessCount} / ${racerTotalDropsCount} 個`;
                if (racerReactionTimes.length > 0) {
                    const minTime = Math.min(...racerReactionTimes);
                    const avgTime = Math.round(racerReactionTimes.reduce((a, b) => a + b, 0) / racerReactionTimes.length);
                    document.getElementById('racer-stat-best').textContent = `${minTime} ms`;
                    document.getElementById('racer-stat-avg').textContent = `${avgTime} ms`;
                } else {
                    document.getElementById('racer-stat-best').textContent = '- ms';
                    document.getElementById('racer-stat-avg').textContent = '- ms';
                }
            } else if (currentGameMode === 'signal') {
                racerStatsRow.style.display = 'none';
                if (f1StatsRow) f1StatsRow.style.display = 'flex';
                if (f1IsFault) {
                    f1StatTime.textContent = 'FAULT';
                    f1StatRating.textContent = 'FALSE START';
                    f1StatRating.style.color = 'var(--danger)';
                } else if (f1IsTimeout) {
                    f1StatTime.textContent = 'NO REACTION';
                    f1StatRating.textContent = 'TIMEOUT';
                    f1StatRating.style.color = 'var(--warning)';
                } else if (f1ReactionTime !== null) {
                    f1StatTime.textContent = `${f1ReactionTime} ms`;
                    let rating = 'AVERAGE';
                    let ratingColor = 'var(--text-title)';
                    if (f1ReactionTime < 190) {
                        rating = 'F1 CHAMPION';
                        ratingColor = '#eab308';
                    } else if (f1ReactionTime < 230) {
                        rating = 'F1 DRIVER';
                        ratingColor = '#16a34a';
                    } else if (f1ReactionTime < 270) {
                        rating = 'PRO RACER';
                        ratingColor = '#2563eb';
                    } else if (f1ReactionTime < 330) {
                        rating = 'FAST';
                        ratingColor = 'var(--mode-color)';
                    }
                    f1StatRating.textContent = rating;
                    f1StatRating.style.color = ratingColor;
                }
            } else {
                racerStatsRow.style.display = 'none';
                if (f1StatsRow) f1StatsRow.style.display = 'none';
            }

            const allScores = rankings.map(r => r.score);
            renderHistogram(allScores, score);

            if (isOnlineRankingEnabled()) {
                reportOnlineResult(`順位: ${myRank} 位 / ${rankings.length} 人中`);
            } else {
                postResultToSite(currentGameMode, score, null);
            }

            const resultContent = document.getElementById('result-content');
            resultContent.classList.remove('animate-pop');
            void resultContent.offsetWidth; 
            resultContent.classList.add('animate-pop');

            resultShownAt = performance.now();
            showScreen('result-screen');
        }

        /* オンラインへスコア送信し、順位・ヒストグラムを全体の結果に差し替える。
           失敗時は端末内の順位に (LOCAL) を付けて表示する */
        let resultRequestSeq = 0;
        function reportOnlineResult(localRankText) {
            const seq = ++resultRequestSeq;
            const rankEl = document.getElementById('result-rank');
            const name = currentTournamentName;
            const mode = currentGameMode;
            const displayedScore = score;
            // サイトへの結果通知は1プレイにつき1回（画面を離れていても送る）
            let siteNotified = false;
            const notifySite = (online) => {
                if (siteNotified) return;
                siteNotified = true;
                postResultToSite(mode, displayedScore, online);
            };
            // サイトモードではサイトのプレイヤー、それ以外は名前ごとのプロフィール
            const sitePlayer = activeSitePlayer;
            const profile = sitePlayer || getOrCreateProfile(name);
            const payload = {
                action: 'submit',
                playerId: profile.playerId,
                secret: profile.secret,
                name: name,
                mode: mode,
                score: score,
                detail: buildScoreDetail(),
                version: GAME_VERSION
            };
            // サイトモードでは、いまのサイトの名前で送る（プレイ中に名前が変わっていても、サーバーの名前を戻さない）
            const sendPayload = sitePlayer ? withLatestSiteName(payload) : payload;

            rankEl.textContent = '順位: 集計中...';

            submitScoreOnline(sendPayload)
                .then(data => {
                    if (data.ok) {
                        if (sitePlayer) saveSitePlayerTag(sitePlayer.playerId, data.tag);
                        else saveProfileTag(name, data.tag);
                    }
                    if (data.ok) {
                        const online = Object.assign({}, data);
                        delete online.scores;
                        notifySite(online);
                    } else {
                        notifySite({ ok: false, error: String(data.error || 'unknown') });
                    }
                    if (seq !== resultRequestSeq) return;
                    if (data.ok) {
                        rankEl.textContent = `順位: ${data.rank} 位 / ${data.total} 人中`;
                        if (Array.isArray(data.scores)) renderHistogram(data.scores, Number(data.score));
                    } else {
                        rankEl.textContent = `${localRankText} (LOCAL)`;
                        console.warn('Online ranking rejected:', data.error);
                    }
                })
                .catch(e => {
                    notifySite({ ok: false, error: 'network' });
                    if (seq !== resultRequestSeq) return;
                    rankEl.textContent = `${localRankText} (LOCAL)`;
                    console.warn('Online ranking unavailable:', e);
                });
        }

        function animateScoreCount(finalScore) {
            const scoreEl = document.getElementById('final-score');
            if (scoreAnimTimer) {
                clearInterval(scoreAnimTimer);
                scoreAnimTimer = null;
            }
            const safeTarget = Math.max(0, Math.floor(Number(finalScore) || 0));
            if (safeTarget === 0) {
                scoreEl.textContent = '0';
                return;
            }
            let current = 0;
            const duration = 400;
            const stepTime = Math.max(16, duration / safeTarget);
            const increment = Math.max(1, Math.ceil(safeTarget / (duration / 16)));
            scoreAnimTimer = setInterval(() => {
                current += increment;
                if (current >= safeTarget) {
                    clearInterval(scoreAnimTimer);
                    scoreAnimTimer = null;
                    scoreEl.textContent = safeTarget;
                } else {
                    scoreEl.textContent = current;
                }
            }, stepTime);
        }

        /* ==========================================================
           ヒストグラム（12本固定・刻み幅自動調整・NaN/ゼロ除算/DOM肥大化防止）
        ========================================================== */
        const HISTOGRAM_BIN_COUNT = 12;

        function calculateHistogramStep(validScores, safeMyScore, binCount = HISTOGRAM_BIN_COUNT) {
            const maxScore = Math.max(0, ...validScores, safeMyScore);
            return Math.max(1, Math.ceil((maxScore + 1) / binCount));
        }

        function renderHistogram(allScores, myScore) {
            const container = document.getElementById('histogram-container');
            container.textContent = '';

            const validScores = allScores.filter(n => typeof n === 'number' && Number.isFinite(n) && n >= 0);
            const safeMyScore = (typeof myScore === 'number' && Number.isFinite(myScore) && myScore >= 0) ? myScore : 0;
            const step = calculateHistogramStep(validScores, safeMyScore, HISTOGRAM_BIN_COUNT);
            const bins = Array(HISTOGRAM_BIN_COUNT).fill(0);


            validScores.forEach(s => {
                const binIdx = Math.min(HISTOGRAM_BIN_COUNT - 1, Math.max(0, Math.floor(s / step)));
                bins[binIdx]++;
            });

            const myBinIdx = Math.min(HISTOGRAM_BIN_COUNT - 1, Math.max(0, Math.floor(safeMyScore / step)));
            const maxCount = Math.max(...bins, 1);

            const header = document.createElement('div');
            header.className = 'histogram-header';
            header.innerHTML = `
                <span>SCORE DISTRIBUTION (${step}刻み)</span>
                <span style="display: flex; gap: 8px;">
                    <span style="color: var(--text-dark);">■ 全体</span>
                    <span style="color: var(--mode-color);">■ 今回の記録</span>
                </span>
            `;
            container.appendChild(header);

            const chart = document.createElement('div');
            chart.className = 'chart-wrapper';

            bins.forEach((count, idx) => {
                const col = document.createElement('div');
                col.className = 'bar-col';

                const isMyBin = (idx === myBinIdx);
                const countLabel = document.createElement('span');
                countLabel.className = 'bar-count-label';
                countLabel.style.color = isMyBin ? 'var(--mode-color)' : 'var(--text-dark)';
                countLabel.textContent = count;

                const bar = document.createElement('div');
                bar.className = `bar-pill ${isMyBin ? 'red' : 'blue'}`;
                const heightPercent = (count / maxCount) * 58;
                bar.style.height = `${Math.max(heightPercent, 3)}px`;

                const label = document.createElement('span');
                label.className = 'bar-bottom-label';
                label.style.color = isMyBin ? 'var(--mode-color)' : 'var(--text-dark)';
                label.style.fontWeight = isMyBin ? 'bold' : 'normal';
                label.textContent = `${idx * step}`;

                col.appendChild(countLabel);
                col.appendChild(bar);
                col.appendChild(label);
                chart.appendChild(col);
            });

            container.appendChild(chart);
        }

        /* ==========================================================
           ランキングテーブル更新（XSS・型保護：textContentによる安全なDOM構築）
        ========================================================== */
        let rankingRequestSeq = 0;

        function updateRankingTable() {
            const titleEl = document.getElementById('ranking-title');
            const baseTitle = `${currentGameMode.toUpperCase()} LEADERBOARD`;
            titleEl.textContent = baseTitle;

            if (!isOnlineRankingEnabled()) {
                renderLocalRanking();
                return;
            }

            const seq = ++rankingRequestSeq;
            const mode = currentGameMode;
            const name = playerNameInput.value.replace(NAME_STRIP_RE, '').trim().slice(0, 10);
            const profile = getProfile(name);
            renderRankingMessage('LOADING...');

            callRankingApi('GET', { action: 'leaderboard', mode: mode, playerId: profile ? profile.playerId : '' })
                .then(data => {
                    if (seq !== rankingRequestSeq) return;
                    if (!data.ok || !Array.isArray(data.top)) throw new Error(data.error || 'Invalid response');
                    renderOnlineRanking(data, profile ? { name: name, tag: profile.tag } : null);
                })
                .catch(e => {
                    if (seq !== rankingRequestSeq) return;
                    console.warn('Online ranking unavailable:', e);
                    titleEl.textContent = `${baseTitle} (LOCAL)`;
                    renderLocalRanking();
                });
        }

        function getRankingUnit() {
            const unitMap = { click: 'pts', move: '列', racer: 'pts', signal: 'pts' };
            return unitMap[currentGameMode] || 'pts';
        }

        function renderRankingMessage(text) {
            const tbody = document.getElementById('ranking-tbody');
            tbody.textContent = '';
            const emptyTr = document.createElement('tr');
            const emptyTd = document.createElement('td');
            emptyTd.colSpan = 3;
            emptyTd.style.textAlign = 'center';
            emptyTd.style.color = 'var(--text-dark)';
            emptyTd.style.padding = '24px';
            emptyTd.textContent = text;
            emptyTr.appendChild(emptyTd);
            tbody.appendChild(emptyTr);
        }

        /* rows: { rank, name, tag, score, isMe } の配列（rank は1始まり） */
        function appendRankingRow(tbody, row, unit) {
            const tr = document.createElement('tr');
            const classes = [];
            if (row.rank === 1) classes.push('rank-gold');
            else if (row.rank === 2) classes.push('rank-silver');
            else if (row.rank === 3) classes.push('rank-bronze');
            if (row.isMe) classes.push('is-me');
            tr.className = classes.join(' ');

            const medal = (row.rank === 1) ? '1st' : (row.rank === 2) ? '2nd' : (row.rank === 3) ? '3rd' : `${row.rank}`;

            const tdRank = document.createElement('td');
            tdRank.textContent = medal;

            const tdName = document.createElement('td');
            tdName.style.textAlign = 'left';
            tdName.textContent = String(row.name || '');
            if (row.tag) {
                const tagSpan = document.createElement('span');
                tagSpan.className = 'name-tag';
                tagSpan.textContent = `#${row.tag}`;
                tdName.appendChild(tagSpan);
            }

            const tdScore = document.createElement('td');
            tdScore.textContent = `${Number(row.score) || 0} ${unit}`;

            tr.appendChild(tdRank);
            tr.appendChild(tdName);
            tr.appendChild(tdScore);
            tbody.appendChild(tr);
        }

        function renderLocalRanking() {
            const top10 = getRankings().slice(0, 10);
            if (top10.length === 0) {
                renderRankingMessage('NO DATA RECORDED');
                return;
            }
            const tbody = document.getElementById('ranking-tbody');
            tbody.textContent = '';
            const unit = getRankingUnit();
            top10.forEach((r, index) => {
                appendRankingRow(tbody, { rank: index + 1, name: r.name, tag: '', score: r.score, isMe: false }, unit);
            });
        }

        function renderOnlineRanking(data, myProfile) {
            if (data.top.length === 0) {
                renderRankingMessage('NO DATA RECORDED');
                return;
            }
            const tbody = document.getElementById('ranking-tbody');
            tbody.textContent = '';
            const unit = getRankingUnit();
            data.top.forEach(r => {
                appendRankingRow(tbody, {
                    rank: Math.max(1, Math.floor(Number(r.rank)) || 1),
                    name: r.name,
                    tag: r.tag,
                    score: r.score,
                    isMe: r.isMe === true
                }, unit);
            });

            // 自分が上位に入っていない場合は区切りの下に自分の順位を表示
            const me = data.me;
            if (me && myProfile && !data.top.some(r => r.isMe === true)) {
                const gapTr = document.createElement('tr');
                gapTr.className = 'ranking-gap';
                const gapTd = document.createElement('td');
                gapTd.className = 'gap-cell';
                gapTd.colSpan = 3;
                gapTd.textContent = '⋮';
                gapTr.appendChild(gapTd);
                tbody.appendChild(gapTr);

                appendRankingRow(tbody, {
                    rank: Math.max(1, Math.floor(Number(me.rank)) || 1),
                    name: myProfile.name,
                    tag: myProfile.tag,
                    score: me.score,
                    isMe: true
                }, unit);
            }
        }

        /* オンラインランキング初期化：名前欄の案内と、前回送れなかったスコアの再送 */
        updateNameHint();
        if (isOnlineRankingEnabled()) {
            flushPendingScores();
        }

        /* 埋め込み時：ゲーム内のランキングを隠し、いまのモードをサイトに知らせる。
           サイト側で名前が変わったら（別ページでの変更も storage イベントで届く）案内を更新する */
        document.body.classList.toggle('embedded', IS_EMBEDDED);
        postModeToSite();
        window.addEventListener('storage', (e) => {
            if (e.key === SITE_PLAYER_STORAGE_KEY || e.key === null) updateNameHint();
        });

        /* 画面回転・リサイズ時のレイアウト自己修復 */
        window.addEventListener('resize', () => {
            if (isGameActive && currentGameMode === 'move') {
                updatePlayerPosition();
            } else if (isGameActive && currentGameMode === 'racer' && racerState === 'waiting') {
                resetRacerBalls();
            }
        });
    </script>
</body>
</html>
