<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲーム ・ bosumoti-game</title>
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/play.css">
<link rel="icon" href="assets/bosumoti-logo.svg" type="image/svg+xml">
<script type="module" src="js/play.js"></script>
</head>
<body>

<header class="site-header container">
  <a class="site-logo" href="index.html">
    <img class="site-logo__mochi" src="assets/bosumoti-logo.svg" alt="" width="44" height="44">
    <span class="site-logo__name">bosumoti-game</span>
  </a>
  <div class="site-header__right">
    <nav class="site-nav" aria-label="メイン">
      <a href="index.html" aria-current="page">ゲーム</a>
      <a href="records.html">この端末の記録</a>
      <a href="news.html">お知らせ</a>
      <a href="about.html">自己紹介</a>
    </nav>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="テーマを切り替え">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"></path></svg>
    </button>
  </div>
</header>

<main class="container play-main">
  <p class="breadcrumb"><a href="index.html">ゲーム</a> ／ <span data-game-name>…</span></p>
  <div class="play-title">
    <span class="play-title__no num" data-game-no></span>
    <h1 class="heading play-title__name" data-game-name>…</h1>
    <span class="play-title__meta" data-game-meta></span>
  </div>

  <div class="play-layout" data-layout="stack">
    <div class="play-game">
      <div class="game-frame" data-frame>
        <iframe class="game-frame__iframe" title="ゲーム画面" allow="fullscreen" data-iframe></iframe>
        <div class="game-frame__curtain" data-curtain>
          <button type="button" class="start-button" data-start>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
            スタート
          </button>
        </div>
        <div class="celebrate" data-celebrate hidden>
          <div class="celebrate__bits" data-bits aria-hidden="true"></div>
          <img class="celebrate__mochi" src="assets/bosumoti-happy.svg" alt="" width="112" height="108">
          <p class="celebrate__title heading">自己ベスト更新！</p>
          <p class="celebrate__score num" data-celebrate-score></p>
        </div>
      </div>

      <p class="my-best">
        あなたのベスト <span class="my-best__value num" data-best>—</span><span class="my-best__unit" data-best-unit></span>
        <span class="my-best__sep" aria-hidden="true">・</span>
        今週 <span class="my-best__value num" data-week-rank>—</span> 位
      </p>
      <p class="play-note" data-note role="status" aria-live="polite"></p>
    </div>

    <section class="ranking" aria-labelledby="ranking-heading">
      <h2 class="heading ranking__heading" id="ranking-heading"><span class="mark" style="--m: var(--color-rank)">ランキング</span></h2>
      <p class="ranking__mode" data-ranking-mode></p>
      <div class="ranking__tabs" role="group" aria-label="期間">
        <button type="button" class="ranking__tab" data-period="week" aria-pressed="true">今週</button>
        <button type="button" class="ranking__tab" data-period="month" aria-pressed="false">今月</button>
        <button type="button" class="ranking__tab" data-period="all" aria-pressed="false">全期間</button>
      </div>
      <ol class="ranking__list" data-ranking-list></ol>
      <p class="ranking__message" data-ranking-message hidden></p>
      <div class="ranking__me" data-ranking-me></div>
      <p class="ranking__note" data-period-note></p>
    </section>

    <section class="howto" aria-labelledby="howto-heading">
      <h2 class="heading howto__heading" id="howto-heading"><span class="mark" style="--m: var(--color-game)">あそびかた</span></h2>
      <p class="howto__mode" data-howto-mode></p>
      <p class="howto__text" data-howto-text></p>
      <div class="howto__keys" data-howto-keys></div>
    </section>
  </div>
</main>

<footer class="site-footer container">
  <p>記録はこの端末に保存されます ・ © 2026 bosumoti-game</p>
</footer>

</body>
</html>
